<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Corp-DFIR</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
  header { background: #1d2330; color: #fff; padding: 10px 20px; display: flex; gap: 20px; align-items: center; }
  header a { color: #cfd6e4; text-decoration: none; }
  header strong { color: #fff; }
  main { padding: 20px; }
  table { border-collapse: collapse; width: 100%; background: #fff; margin-bottom: 24px; }
  th, td { border-bottom: 1px solid #e3e6ec; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #eef0f4; font-weight: 600; }
  .sev-alta { color: #b00020; font-weight: 600; }
  .sev-media { color: #b36b00; font-weight: 600; }
  .sev-baixa { color: #556; }
  .snip { font-family: ui-monospace, monospace; font-size: 12px; max-width: 520px; word-break: break-word; }
  form.filters { margin-bottom: 12px; display: flex; gap: 8px; }
  .muted { color: #778; font-size: 12px; }
</style>
</head>
<body>
<header>
  <strong>Corp-DFIR</strong>
  <a href="/">Coletas</a>
  <a href="/findings">Achados</a>
  <a href="/secrets">Segredos correlacionados</a>
  <a href="/remote">Acessos remotos</a>
  <a href="/certs">Certificados</a>
  <a href="/export/findings.csv">Exportar CSV</a>
  <a href="/admin">Configurações</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
