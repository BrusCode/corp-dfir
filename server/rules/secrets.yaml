# Padrões de segredo. "secret: true" => valor mascarado e com fingerprint.
# "context" (opcional) => só dispara se o contexto aparecer até 40 caracteres antes.
- id: openrouter_key
  category: segredo
  severity: alta
  secret: true
  pattern: 'sk-or-v1-[A-Za-z0-9]{32,}'
- id: anthropic_key
  category: segredo
  severity: alta
  secret: true
  pattern: 'sk-ant-[A-Za-z0-9_\-]{20,}'
- id: openai_key
  category: segredo
  severity: alta
  secret: true
  pattern: 'sk-(?:proj-)?[A-Za-z0-9_\-]{32,}'
- id: github_token
  category: segredo
  severity: alta
  secret: true
  pattern: '(?:ghp|gho|ghu|ghs|github_pat)_[A-Za-z0-9_]{30,}'
- id: aws_access_key
  category: segredo
  severity: alta
  secret: true
  pattern: 'AKIA[0-9A-Z]{16}'
- id: jwt
  category: segredo
  severity: media
  secret: true
  pattern: 'eyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}'
- id: private_key
  category: segredo
  severity: alta
  secret: false
  pattern: '-----BEGIN (?:RSA |EC |ENCRYPTED )?PRIVATE KEY-----'
- id: client_id
  category: segredo
  severity: alta
  secret: true
  context: '(?i)client[ _-]?id|client[ _-]?secret|api[ _-]?key|secret[ _-]?key|sicoob|credencial'
  pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
- id: client_secret_kv
  category: segredo
  severity: alta
  secret: true
  pattern: '(?i)(?:client[_ -]?secret|secret[_ -]?key|api[_ -]?key)\s*[:=]\s*"?[A-Za-z0-9_\-]{16,}'
- id: cert_password
  category: segredo
  severity: alta
  secret: false
  pattern: '(?i)senha\s+(?:do\s+)?certificado|certificate\s+password|pfx\s+password'
