# Palavras-chave de golpe/fraude em PT-BR. Indício, não prova: a triagem humana/IA decide.
- id: fraude_laranja
  category: fraude
  severity: alta
  pattern: '(?i)\b(?:conta\s+)?laranjas?\b|conta\s+de\s+passagem'
- id: fraude_segredo
  category: fraude
  severity: alta
  pattern: '(?i)n[ãa]o\s+conta\s+(?:pra|para)\s+ningu[ée]m|apaga\s+(?:essa|esta|a)\s+conversa|sem\s+deixar\s+rastro'
- id: fraude_desvio_pix
  category: fraude
  severity: alta
  pattern: '(?i)(?:desviar|redirecionar|trocar)\s+(?:o\s+)?(?:pix|boleto|pagamento|chave)'
- id: fraude_limite
  category: fraude
  severity: media
  pattern: '(?i)(?:abaixo|menos)\s+(?:de|do)\s+(?:limite|10\s*mil)|9\.?999'
- id: fraude_certificado
  category: fraude
  severity: media
  pattern: '(?i)(?:exportar|copiar|mandar|enviar)\s+(?:o\s+)?(?:certificado|pfx|\.pfx)'
- id: fraude_engenharia_social
  category: fraude
  severity: media
  pattern: '(?i)(?:urgente|r[áa]pido).{0,40}(?:transfer|pix|pagamento)|se\s+passar\s+por'
- id: acesso_remoto_tool
  category: acesso_remoto
  severity: baixa
  pattern: '(?i)\b(?:anydesk|teamviewer|rustdesk|quicksupport)\b'
